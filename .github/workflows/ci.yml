name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build Services
        run: |
          for dir in auth-service rpc-proxy billing-engine dashboard; do
            echo "::group::Installing $dir"
            cd "$dir"
            npm install
            npm run build
            npm run test --if-present -- --run
            cd - >/dev/null
            echo "::endgroup::"
          done
  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker images
        run: docker compose build auth-service rpc-proxy billing-engine dashboard
